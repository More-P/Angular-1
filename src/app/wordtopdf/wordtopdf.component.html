<div class="container">
  <h2>Convert Word to PDF</h2>
  <input type="file" (change)="onFileSelected($event)" accept=".docx" />
  <button (click)="convertToPdf()" [disabled]="!htmlContent">Convert to PDF</button>

 
<div class="preview" *ngIf="htmlContent" [innerHTML]="htmlContent"></div>
</div>
